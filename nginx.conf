server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html index.htm;

    # Gzip Compression for maximum speed
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # HTML files - revalidate for fast local updates
    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-cache, public, must-revalidate";
    }

    # Static Assets - cache effectively
    location ~* \.(css|js|svg|png|jpg|jpeg|gif|ico|woff|woff2)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # Default location & fallback
    location / {
        try_files $uri $uri/ $uri.html /index.html =404;
    }

    # 404 Error handling
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
